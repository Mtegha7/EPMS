<table class="table table-striped">
    <thead class="thead-dark">
        <tr>
            <th *ngFor="let column of this.tasks_service.tasksColumns">{{column}}</th>
        </tr>
    </thead>

    <tbody>
        <tr *ngFor="let data of this.tasks_service.tasks">
            <td *ngFor="let item of this.tasks_service.tasksColumns">{{data[item]}}</td>
            <button (click)="view_tasks(data)">Edit</button>
            <button class="btn-light btn-small" (click)="delete_tasks(data)"><i
                    class="bi bi-person-x"></i>Delete</button>
        </tr>
    </tbody>
</table>

<div *ngIf="info">
    <h3>Task Information</h3>
    <p><strong>Title:</strong> {{ info.title }}</p>
    <p><strong>Description:</strong> {{ info.description }}</p>
    <p><strong>Created Date:</strong> {{ info.createdDate }}</p>
    <p><strong>Due Date:</strong> {{ info.dueDate }}</p>
    <p><strong>Updated Date:</strong> {{ info.updatedDate }}</p>
    <p><strong>Completion Date:</strong> {{ info.completionDate }}</p>
    <p><strong>Assigned To (User ID):</strong> {{ info.userID }}</p>

</div>
