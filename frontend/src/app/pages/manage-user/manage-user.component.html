<div class="container mt-4">
  <table class="table table-boardered">
    <thead class="thead-dark">
      <tr>
        <th *ngFor="let column of this.users_service.usersColumns">{{column}}</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let data of this.users_service.users">
        <td *ngFor="let item of this.users_service.usersColumns">{{data[item]}}</td>
        <button class="btn-light btn-small" (click)="view_user(data)"><i class="bi bi-pencil"></i>Edit</button>
        <button class="btn-light btn-small" (click)="view_user(data)"><i class="bi bi-person-x"></i>Delete</button>
      </tr>
    </tbody>
  </table>
</div>
